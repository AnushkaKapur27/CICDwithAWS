<!DOCTYPE html>
<html>
<body>
<h1>Student Details</h1>
<p id="data"></p>

<script>
fetch('http://localhost:5000/student-details')
.then(res => res.json())
.then(data => {
    document.getElementById("data").innerText =
        data.name + " | " + data.roll + " | " + data.register;
});
</script>

</body>
</html>
